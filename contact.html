<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お問い合わせ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Microsoft Forms用に高さだけ調整 */
    iframe.ms-form {
      width: 100%;
      height: 900px;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>お問い合わせ</h1>
  <nav>
    <a href="index.html">ポートフォリオ</a>|
    <a href="profile.html">プロフィール</a>|
    <a href="contact.html">お問い合わせ</a>
  </nav>
</header>

<section>
  <h2>お問い合わせフォーム</h2>
  <p>ご質問やご感想など、どんな内容でもお気軽にお送りください。<br>
     こちらからの返信が必要な場合は、お手数ですがメールアドレスのご入力をお願いいたします。<br>
     ※名前、メールアドレスは任意入力のため、匿名での送信も可能です。</p>

  <!-- 🔹 ロード中メッセージ -->
  <div id="loading-message">
    マイクロソフトフォームを読み込み中です。少しお待ちください…
  </div>

  <!-- ▼ マイクロソフトフォームを埋め込む -->
  <iframe
    id="ms-form"
    class="ms-form"
    src="https://forms.office.com/Pages/ResponsePage.aspx?id=vp42Lm8OF0qu0CvTeDIk_mT6iTL8O8BKkpQzoKAa1VZUN0JVOVBCN1o0R1oyV1VOWUo5S1dIUDlLSy4u&embedded=true">
    読み込んでいます…
  </iframe>

</section>

<footer>
  <p>© 2026 鮫島 紳吾</p>
</footer>

<script>
  // iframe が読み込まれたらローディング表示を消す
  document.getElementById("ms-form").addEventListener("load", function() {
    document.getElementById("loading-message").style.display = "none";
  });
</script>

</body>
</html>
