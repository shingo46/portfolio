<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
  <a-scene embedded>
    <a-assets>
      <a-asset-item id="model2" src="assets/model2.glb"></a-asset-item>
    </a-assets>

    <a-entity gltf-model="#model2" position="0 0 0" scale="1 1 1"></a-entity>
    <a-sky color="#ECECEC"></a-sky>

    <!-- このシーン専用のカメラ（独立） -->
    <a-entity camera look-controls wasd-controls 
              position="15 15 0" rotation="-15 50 0"></a-entity>
  </a-scene>
</body>
</html>
