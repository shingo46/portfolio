<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    html, body, a-scene {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #loading-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #f0f0f0;
      transition: opacity 0.5s;
      z-index: 10;
    }

    #loading-image.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <img id="loading-image" src="assets/model2_preview.png" alt="Loading...">

  <!-- 上下移動コンポーネント -->
  <script>
AFRAME.registerComponent("flat-wasd", {
  schema: {
    speed: {default: 3}
  },

  init: function () {
    this.keys = {};
    window.addEventListener("keydown", e => this.keys[e.code] = true);
    window.addEventListener("keyup",   e => this.keys[e.code] = false);
  },

  tick: function (time, delta) {
    const el = this.el;
    const pos = el.getAttribute("position");
    const rot = el.getAttribute("rotation");
    const move = this.data.speed * (delta / 1000);

    // --- 水平方向だけの角度（Y軸回転） ---
    const yaw = THREE.MathUtils.degToRad(rot.y);

    // 基本方向ベクトル（カメラの傾きは無視）
    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right   = new THREE.Vector3(-forward.z, 0, forward.x);

    // --- 移動処理（地面と水平のみ） ---
    if (this.keys["KeyW"]) {
      pos.x += forward.x * move;
      pos.z += forward.z * move;
    }
    if (this.keys["KeyS"]) {
      pos.x -= forward.x * move;
      pos.z -= forward.z * move;
    }
    if (this.keys["KeyA"]) {
      pos.x -= right.x * move;
      pos.z -= right.z * move;
    }
    if (this.keys["KeyD"]) {
      pos.x += right.x * move;
      pos.z += right.z * move;
    }

    el.setAttribute("position", pos);
  }
});
</script>

  <a-scene embedded>
    <a-assets>
      <a-asset-item id="model2" src="assets/model2.glb"></a-asset-item>
    </a-assets>

    <a-entity id="modelEntity"
              gltf-model="#model2"
              position="0 0 0"
              scale="3 3 3">
    </a-entity>

    <a-sky color="#ECECEC"></a-sky>

    <a-entity camera 
              look-controls
              flat-wasd
              fly-updown
              position="0 4 2">
    </a-entity>
  </a-scene>

  <script>
    const model = document.getElementById("modelEntity");
    const loadingImage = document.getElementById("loading-image");

    model.addEventListener("model-loaded", () => {
      console.log("モデル読み込み完了");
      loadingImage.classList.add("hidden");
    });
  </script>

</body>
</html>
