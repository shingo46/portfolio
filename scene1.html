<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    html, body, a-scene {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* ロード中に表示する画像 */
    #loading-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #f0f0f0;
      transition: opacity 0.5s;
      z-index: 10;
    }

    #loading-image.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- 🔹 ロード中に表示する画像 -->
  <img id="loading-image" src="assets/model1_preview.png" alt="Loading...">

  <!-- 🔹 A-Frame 上下移動コンポーネント -->
  <script>
    AFRAME.registerComponent('fly-updown', {
      schema: {
        speed: {default: 3}
      },

      init: function () {
        this.keys = {};
        window.addEventListener('keydown', (e) => { this.keys[e.code] = true; });
        window.addEventListener('keyup',   (e) => { this.keys[e.code] = false; });
      },

      tick: function (time, delta) {
        const el = this.el;
        const pos = el.getAttribute('position');
        const move = this.data.speed * (delta / 1000);

        if (this.keys["Space"]) pos.y += move; // 上昇
        if (this.keys["ShiftLeft"] || this.keys["ShiftRight"]) pos.y -= move; // 下降

        el.setAttribute('position', pos);
      }
    });
  </script>

  <a-scene embedded>
    <a-assets>
      <a-asset-item id="model1" src="assets/model1.glb"></a-asset-item>
    </a-assets>

    <a-entity id="modelEntity"
              gltf-model="#model1"
              position="0 0 0"
              scale="3 3 3">
    </a-entity>

    <a-sky color="#ECECEC"></a-sky>

    <!-- 🎥 カメラ：上下移動＋WASD対応 -->
    <a-entity camera 
              look-controls
              wasd-controls="fly: true"
              fly-updown
              position="0 4 2">
    </a-entity>
  </a-scene>

  <script>
    const model = document.getElementById("modelEntity");
    const loadingImage = document.getElementById("loading-image");

    model.addEventListener("model-loaded", () => {
      console.log("モデル読み込み完了");
      loadingImage.classList.add("hidden");
    });
  </script>

</body>
</html>
